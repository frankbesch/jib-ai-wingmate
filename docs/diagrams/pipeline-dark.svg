<svg viewBox="0 0 360 466" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Permit packet to approved record</title>
<desc>The well-file pipeline. A permit packet comes in: a Texas RRC drilling permit with its plats, or a synthetic oil and gas month. A document parser classifies each document, splits the packet by page, and extracts a schema for each class. Every value keeps a citation to its page box. The scorer grades fields and citations against truth, and reconcile rules check the money. A named reviewer approves or routes each exception into an append-only audit file. Fixture mode replays stored responses with no key and no network.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="466" rx="6" fill="#12142A"/>
<text x="16" y="30" font-size="15" fill="#E2E4F4" font-weight="600" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Permit packet to approved record</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#30365A"/>
<rect x="16" y="56" width="328" height="54" rx="5" fill="#202542" stroke="#A3A8C6" stroke-width="1.5"/>
<text x="180" y="79" font-size="12.5" fill="#E2E4F4" text-anchor="middle" font-weight="600">Packet in</text>
<text x="180" y="97" font-size="12" fill="#A3A8C6" text-anchor="middle">RRC permit and plats, or a synthetic month</text>
<path d="M180 112 L180 130" fill="none" stroke="#A3A8C6" stroke-width="1.5"/><polygon points="175,122 185,122 180,130" fill="#A3A8C6"/>
<rect x="16" y="134" width="328" height="54" rx="5" fill="#202542" stroke="#17A1C8" stroke-width="1.5"/>
<text x="180" y="157" font-size="12.5" fill="#E2E4F4" text-anchor="middle" font-weight="600">Document parser</text>
<text x="180" y="175" font-size="12" fill="#A3A8C6" text-anchor="middle">classify, split by page, extract</text>
<path d="M180 190 L180 208" fill="none" stroke="#A3A8C6" stroke-width="1.5"/><polygon points="175,200 185,200 180,208" fill="#A3A8C6"/>
<rect x="16" y="212" width="328" height="54" rx="5" fill="#202542" stroke="#6DA361" stroke-width="1.5"/>
<text x="180" y="235" font-size="12.5" fill="#E2E4F4" text-anchor="middle" font-weight="600">Schema per class, with citations</text>
<text x="180" y="253" font-size="12" fill="#A3A8C6" text-anchor="middle">each value keeps its page box</text>
<path d="M180 268 L180 286" fill="none" stroke="#A3A8C6" stroke-width="1.5"/><polygon points="175,278 185,278 180,286" fill="#A3A8C6"/>
<rect x="16" y="290" width="328" height="54" rx="5" fill="#202542" stroke="#D17276" stroke-width="1.5"/>
<text x="180" y="313" font-size="12.5" fill="#E2E4F4" text-anchor="middle" font-weight="600">Score and reconcile</text>
<text x="180" y="331" font-size="12" fill="#A3A8C6" text-anchor="middle">fields and citations vs truth; money rules</text>
<path d="M180 346 L180 364" fill="none" stroke="#A3A8C6" stroke-width="1.5"/><polygon points="175,356 185,356 180,364" fill="#A3A8C6"/>
<rect x="16" y="368" width="328" height="54" rx="5" fill="#202542" stroke="#559ACA" stroke-width="1.5"/>
<text x="180" y="391" font-size="12.5" fill="#E2E4F4" text-anchor="middle" font-weight="600">Named reviewer decides</text>
<text x="180" y="409" font-size="12" fill="#A3A8C6" text-anchor="middle">approve or route; append-only audit file</text>
<text x="16" y="448" font-size="12" fill="#A3A8C6" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Fixture mode replays stored responses: no key, no network.</text>
</svg>
