<svg class="fl" viewBox="0 0 1180 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The operator's month: operator paper into the document parser, parser output into customer code, the pack back to the operator">
<style>
.fl text{font-family:'Avenir Next',Avenir,'Helvetica Neue',Arial,sans-serif}
.fl .lane{fill:var(--mute,#EFEDE9);opacity:.55}
.fl .lane.pulse{fill:var(--teal-bg,#EAF0F1);opacity:.9}
.fl .lane.cust{fill:var(--navy-bg,#E9EDF0);opacity:.9}
.fl .lanelbl{font-size:10.5px;letter-spacing:.12em;fill:var(--slate,#67727A);font-weight:700}
.fl .node rect{fill:var(--card,#fff);stroke:var(--rule,#C9C3BB);stroke-width:1.2;rx:7}
.fl .node.pulse rect{stroke:var(--teal,#5B7F87)}
.fl .node.cust rect{stroke:var(--navy,#50687A)}
.fl .node .t{font-size:13px;font-weight:700;fill:var(--ink,#2F3437)}
.fl .node .s{font-size:10.5px;fill:var(--slate,#67727A)}
.fl .node .n{font-size:10px;font-weight:700;fill:#fff}
.fl .node .nc{fill:var(--navy,#50687A)}
.fl .node.pulse .nc{fill:var(--teal,#5B7F87)}
.fl .node.on rect{stroke:var(--ochre,#C8923B);stroke-width:3;fill:var(--ochre-bg,#F7EEDD)}
.fl .node.on .nc{fill:var(--ochre,#C8923B)}
.fl .edge{fill:none;stroke:var(--slate,#8A9299);stroke-width:1.6;marker-end:url(#fl-arrow)}
.fl .edge.measure{stroke-dasharray:5 4;stroke:var(--navy,#50687A)}
.fl .bound{stroke:var(--terra,#B55D43);stroke-width:1.5;stroke-dasharray:7 5}
.fl .boundlbl{font-size:10.5px;font-weight:700;fill:var(--terra,#B55D43);letter-spacing:.06em}
.fl .foot{font-size:10px;fill:var(--slate,#67727A)}
</style>
<defs><marker id="fl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--slate,#8A9299)"/></marker></defs>
<rect class="lane paper" x="8" y="34" width="1164" height="118" rx="9"/>
<text class="lanelbl" x="22" y="49">OPERATOR PAPER · arrives by email across the month</text>
<rect class="lane pulse" x="8" y="176" width="1164" height="118" rx="9"/>
<text class="lanelbl" x="22" y="191">DOCUMENT PARSER API · documented endpoints, billed per page</text>
<rect class="lane cust" x="8" y="318" width="1164" height="130" rx="9"/>
<text class="lanelbl" x="22" y="333">CUSTOMER CODE · rules, queue, pack, scorecard</text>
<line class="bound" x1="8" y1="312" x2="1172" y2="312"/>
<text class="boundlbl" x="1166" y="307" text-anchor="end">THE PARSER STOPS HERE · everything below is the customer's</text>
<path class="edge flow" d="M99.0,123.0 C99.0,164.0 119.0,164.0 119.0,203.0"/>
<path class="edge flow" d="M285.0,123.0 C285.0,164.0 119.0,164.0 119.0,203.0"/>
<path class="edge flow" d="M471.0,123.0 C471.0,164.0 119.0,164.0 119.0,203.0"/>
<path class="edge flow" d="M214,235.0 L234,235.0"/>
<path class="edge flow" d="M426,235.0 L446,235.0"/>
<path class="edge flow" d="M638,235.0 L658,235.0"/>
<path class="edge flow" d="M773.0,265.0 C773.0,309.0 311.0,309.0 311.0,351.0"/>
<path class="edge flow" d="M406,383.0 L426,383.0"/>
<path class="edge flow" d="M618,383.0 L638,383.0"/>
<path class="edge flow" d="M725.0,353.0 C725.0,238.0 1043.0,238.0 1043.0,125.0"/>
<path class="edge measure" d="M109.0,413.0 L109.0,427.0 L907.0,427.0 L907.0,415.0"/>
<path class="edge flow" d="M810,383.0 L830,383.0"/>
<path class="edge flow" d="M982,383.0 L1002,383.0"/>
<g class="node paper" data-step="1" id="dr-d1"><rect x="24" y="63.0" width="150" height="60"/><circle class="nc" cx="38" cy="77.0" r="9"/><text class="n" x="38" y="80.5" text-anchor="middle">1</text><text class="t" x="52" y="81.0">Day 1</text>
<text class="s" x="34" y="98.0">AFE + cover letter</text>
</g>
<g class="node paper" data-step="1" id="dr-d12"><rect x="190" y="63.0" width="190" height="60"/><circle class="nc" cx="204" cy="77.0" r="9"/><text class="n" x="204" y="80.5" text-anchor="middle">1</text><text class="t" x="218" y="81.0">Day 12</text>
<text class="s" x="200" y="98.0">2 field tickets · hauling log ·</text>
<text class="s" x="200" y="111.0">invoice (one PDF, 4 docs)</text>
</g>
<g class="node paper" data-step="1" id="dr-d30"><rect x="396" y="63.0" width="150" height="60"/><circle class="nc" cx="410" cy="77.0" r="9"/><text class="n" x="410" y="80.5" text-anchor="middle">1</text><text class="t" x="424" y="81.0">Day 30</text>
<text class="s" x="406" y="98.0">JIB statement, 8 lines</text>
</g>
<g class="node paper" data-step="8" id="dr-back"><rect x="930" y="63.0" width="226" height="60"/><circle class="nc" cx="944" cy="77.0" r="9"/><text class="n" x="944" y="80.5" text-anchor="middle">8</text><text class="t" x="958" y="81.0">Back to the operator</text>
<text class="s" x="940" y="98.0">audit pack inside the JOA audit window</text>
</g>
<g class="node pulse" data-step="3" id="dr-cls"><rect x="24" y="205.0" width="190" height="60"/><circle class="nc" cx="38" cy="219.0" r="9"/><text class="n" x="38" y="222.5" text-anchor="middle">3</text><text class="t" x="52" y="223.0">Classify · 4.5 cr</text>
<text class="s" x="34" y="240.0">document type per document,</text>
<text class="s" x="34" y="253.0">sampled pages</text>
</g>
<g class="node pulse" data-step="4" id="dr-spl"><rect x="236" y="205.0" width="190" height="60"/><circle class="nc" cx="250" cy="219.0" r="9"/><text class="n" x="250" y="222.5" text-anchor="middle">4</text><text class="t" x="264" y="223.0">Split · 18 cr</text>
<text class="s" x="246" y="240.0">page group per document inside a</text>
<text class="s" x="246" y="253.0">bundle</text>
</g>
<g class="node pulse" data-step="5" id="dr-ext"><rect x="448" y="205.0" width="190" height="60"/><circle class="nc" cx="462" cy="219.0" r="9"/><text class="n" x="462" y="222.5" text-anchor="middle">5</text><text class="t" x="476" y="223.0">Extract · 9 cr</text>
<text class="s" x="458" y="240.0">text, tables, word boxes</text>
</g>
<g class="node pulse" data-step="5" id="dr-sch"><rect x="660" y="205.0" width="226" height="60"/><circle class="nc" cx="674" cy="219.0" r="9"/><text class="n" x="674" y="222.5" text-anchor="middle">5</text><text class="t" x="688" y="223.0">Schema · 9 cr</text>
<text class="s" x="670" y="240.0">the fields asked for, a citation on</text>
<text class="s" x="670" y="253.0">each: page + box</text>
</g>
<g class="node cust" data-step="2" id="dr-gng"><rect x="24" y="353.0" width="170" height="60"/><circle class="nc" cx="38" cy="367.0" r="9"/><text class="n" x="38" y="370.5" text-anchor="middle">2</text><text class="t" x="52" y="371.0">Go/no-go, declared</text>
<text class="s" x="34" y="388.0">seven lines, spoken before</text>
<text class="s" x="34" y="401.0">the first upload</text>
</g>
<g class="node cust" data-step="6" id="dr-rec"><rect x="216" y="353.0" width="190" height="60"/><circle class="nc" cx="230" cy="367.0" r="9"/><text class="n" x="230" y="370.5" text-anchor="middle">6</text><text class="t" x="244" y="371.0">Reconcile · 3 rules</text>
<text class="s" x="226" y="388.0">net = gross × decimal · rate ≤</text>
<text class="s" x="226" y="401.0">contract · AFE ref</text>
</g>
<g class="node cust" data-step="7" id="dr-que"><rect x="428" y="353.0" width="190" height="60"/><circle class="nc" cx="442" cy="367.0" r="9"/><text class="n" x="442" y="370.5" text-anchor="middle">7</text><text class="t" x="456" y="371.0">Queue · typed approver</text>
<text class="s" x="438" y="388.0">exceptions only; a blank name is</text>
<text class="s" x="438" y="401.0">refused</text>
</g>
<g class="node cust" data-step="8" id="dr-pak"><rect x="640" y="353.0" width="170" height="60"/><circle class="nc" cx="654" cy="367.0" r="9"/><text class="n" x="654" y="370.5" text-anchor="middle">8</text><text class="t" x="668" y="371.0">Audit pack</text>
<text class="s" x="650" y="388.0">every line with its page</text>
<text class="s" x="650" y="401.0">strip</text>
</g>
<g class="node cust" data-step="9" id="dr-sco"><rect x="832" y="353.0" width="150" height="60"/><circle class="nc" cx="846" cy="367.0" r="9"/><text class="n" x="846" y="370.5" text-anchor="middle">9</text><text class="t" x="860" y="371.0">Scorecard</text>
<text class="s" x="842" y="388.0">measured vs declared;</text>
<text class="s" x="842" y="401.0">144 s, $0.61</text>
</g>
<g class="node cust" data-step="10" id="dr-val"><rect x="1004" y="353.0" width="152" height="60"/><circle class="nc" cx="1018" cy="367.0" r="9"/><text class="n" x="1018" y="370.5" text-anchor="middle">10</text><text class="t" x="1032" y="371.0">Value line</text>
<text class="s" x="1014" y="388.0">buyer&#x27;s three inputs,</text>
<text class="s" x="1014" y="401.0">blank until given</text>
</g>
<text class="foot" x="22" y="462">Numbers from runs/live-synth-03 (2026-09-05): 9 pages, 40.5 credits, $0.61 at list; two planted mistakes caught, nothing else flagged. Node numbers are the console steps.</text>
</svg>