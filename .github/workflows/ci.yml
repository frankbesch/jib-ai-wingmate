name: CI
# Offline checks only: fixture mode, no parser calls, no keys, no spend.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poppler (pdftotext for fixture page words)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Scorer selftest, hand-computed values
        run: python3 -B score.py --selftest

      - name: Synthetic month, fixture mode
        run: |
          python3 -B make_fixtures.py --set synth
          python3 -B pipeline.py --mode fixture --set synth --run-id fixture-synth-01
          python3 -B tests/test_synth_pipeline.py

      - name: Reconcile rules
        run: python3 -B tests/test_reconcile.py

      # test_orchestrator.py is macOS-only (sandbox-exec, DARWIN_USER_TEMP_DIR);
      # see Known limitations in README.md.
      - name: Held-out tests (audit, controls, score)
        run: python3 -B -m unittest discover -s heldout2/tests -p 'test_[acs]*.py'

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          V: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          tgz="gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tgz}"
          curl -sSfL "${base}/gitleaks_${V}_checksums.txt" -o sums.txt
          grep " ${tgz}\$" sums.txt | sha256sum -c -
          tar -xzf "${tgz}" gitleaks

      - name: Scan full history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
