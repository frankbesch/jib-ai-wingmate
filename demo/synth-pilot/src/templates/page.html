<!doctype html><html><head><meta charset="utf-8"><style>
@page { size: Letter; margin: 0; }
* { box-sizing:border-box; }
body { margin:0; color:#19252a; font-family:Arial,sans-serif; font-size:12px; }
.page { width:8.5in; height:11in; padding:0.55in 0.55in 0.5in; position:relative; break-after:page; overflow:hidden; }
.page:last-child { break-after:auto; }
.eyebrow { font-size:10px; letter-spacing:2px; color:#526269; border-bottom:3px solid #344d59; padding-bottom:10px; }
h1 { font-size:25px; margin:22px 0 15px; font-weight:500; }
h2 { font-size:14px; margin:24px 0 12px; }
.fields { margin:16px 0; }
.field { display:flex; padding:5px 0; border-bottom:1px solid #d6dddf; min-height:25px; }
.label { width:180px; flex-shrink:0; color:#42545b; }
.value { font-weight:600; }
p { line-height:1.65; }
table { width:100%; border-collapse:collapse; margin:16px 0; font-size:11px; }
th { background:#e4ebed; text-align:left; font-weight:600; padding:9px 5px; }
td { padding:10px 5px; border-bottom:1px solid #c1cdd1; white-space:nowrap; }
.compact td,.compact th { font-size:10px; padding:10px 4px; }
.note { border-left:3px solid #a5b6bd; padding:12px; margin:20px 0; background:#f1f4f4; }
.letter { font-family:Georgia,serif; font-size:14px; }
.stamp { display:inline-block; border:3px double #795e64; color:#795e64; transform:rotate(-7deg); padding:7px 20px; font-size:19px; margin:8px 0; }
.signature { margin-top:25px; padding-top:16px; border-top:1px solid #b5c1c6; }
footer { position:absolute; bottom:0.33in; left:0.55in; right:0.55in; border-top:1px solid #abb9bf; padding-top:8px; color:#64747b; font-size:9px; }
</style></head><body>$pages</body></html>
